@if (cargando){
<p>Cargando productos...</p>
}
@if (error) {
<p>{{ error }}</p>
}

@if (producto) {
<main>
   

    <!-- -------------------articulo ----------------------->


    <div class="producto-page">
        <div class="producto-principal">
            <div class="producto-img">
                <img class=producto-img [src]=producto.imagen_portada_url alt="producto.nombre">
            </div>
            <mat-card class="producto-info" appearance="outlined">
                <mat-card-header>
                    <div mat-card-avatar class="example-header-image"></div>
                    <mat-card-title>{{producto.nombre}}</mat-card-title>
                    <mat-card-subtitle>Dog Breed</mat-card-subtitle>
                </mat-card-header>

                <mat-card-content>
                </mat-card-content>
                <mat-card-actions>
                    <div class="acciones">
                        <mat-form-field appearance="outline" class="campo-cantidad">
                            <mat-label>Cantidad</mat-label>
                            <mat-select [(ngModel)]="cantidadesSeleccionadas[producto.id]">
                                @for (cantidad of cantidades; track cantidad.value) {
                                <mat-option [value]="cantidad.value">
                                    {{ cantidad.viewValue }}
                                </mat-option>
                                }
                            </mat-select>
                        </mat-form-field>
                        <button mat-button>Comprar ahora</button>
                        <button mat-button
                        (click)="addToCart(producto)"
                        >Añadir al carrito</button>
                    </div>

                </mat-card-actions>
            </mat-card>
        </div>
        <mat-card class="example-card" appearance="outlined">
            <mat-card-header>
                <mat-card-title>{{producto.nombre}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <p>{{producto.descripcion}}</p>
            </mat-card-content>
            <mat-card-footer class="example-card-footer">
                <mat-chip-set aria-label="Chihuahua traits">
                    <mat-chip>Dulce</mat-chip>
                    <mat-chip>Natural</mat-chip>
                    <mat-chip>Producto nacional</mat-chip>
                </mat-chip-set>
            </mat-card-footer>
        </mat-card>
    </div>



</main>
}
